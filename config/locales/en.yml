# Human-readable messages for the API error envelope. The key is the symbol a
# service returns, which the response carries as its machine-readable `code`.
# Keeping the two apart is what lets the domain layer stay free of English.
en:
  api:
    errors:
      unknown: "Something went wrong."
      record_not_found: "The requested resource could not be found."
      parameter_missing: "A required parameter is missing."
      invalid_availability_filter: "The available filter accepts only true or false."
      book_on_loan: "This book is on loan and cannot be withdrawn until it is returned."
      validation_failed: "The submitted data is not valid."
